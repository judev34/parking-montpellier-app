name: Deploy to Hostinger

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.14.0'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build-prod
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_DOMAIN: ${{ secrets.VITE_DOMAIN }}
          VITE_PAYPAL_DONATION_URL: ${{ secrets.VITE_PAYPAL_DONATION_URL }}
          VITE_TIPEEE_DONATION_URL: ${{ secrets.VITE_TIPEEE_DONATION_URL }}
          
      - name: Deploy to Hostinger via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          port: 22  # Port SFTP standard
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './dist/*'  # Dossier local à déployer
          remote_path: '/public_html/'  # Dossier distant sur le serveur
          sftp_only: true  # Utiliser uniquement SFTP
